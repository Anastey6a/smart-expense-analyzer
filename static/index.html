<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Smart Expense Analyzer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0b132b;
      --card: #1c2541;
      --input: #243056;
      --accent: #48cae4;
      --accent-hover: #0096c7;
      --text: #ffffff;
      --muted: #94a3b8;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 40px; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; }
    .brand h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .user-tag { font-size: 0.75rem; color: var(--muted); }
    .btn-logout { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 6px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

    .card { background-color: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
    .balance-card { display: flex; flex-direction: column; gap: 10px; background: linear-gradient(135deg, #1c2541 0%, #1e293b 100%); border: 1px solid rgba(72, 202, 228, 0.2); }
    .balance-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .balance-val { font-size: 2.2rem; font-weight: 700; color: #fff; }
    .forecast-box { background: var(--input); padding: 10px 14px; border-radius: 14px; display: flex; justify-content: space-between; font-size: 0.85rem; }
    .forecast-box strong { color: var(--accent); }

    .input-group { display: flex; flex-direction: column; gap: 10px; }
    .input-text { width: 100%; background: var(--input); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; color: #fff; font-size: 1rem; outline: none; }
    .input-text:focus { border-color: var(--accent); }

    .chip-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .chip { background: var(--input); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--accent); color: #0b132b; font-weight: 700; border-color: var(--accent); }

    .btn-submit { background: var(--accent); color: #0b132b; border: none; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-submit:active { background: var(--accent-hover); }

    .chart-container { position: relative; height: 200px; margin: 10px 0; display: flex; justify-content: center; align-items: center; }
    .section-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }

    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    .tx-item { background: var(--input); border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; }
    .tx-desc { font-weight: 600; font-size: 0.92rem; }
    .tx-sub { font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; margin-top: 2px; }
    .tx-cat-badge { background: rgba(72, 202, 228, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    .tx-amount { font-weight: 700; font-size: 1rem; color: #fff; }
    .btn-delete { background: none; border: none; color: #64748b; font-size: 1.1rem; cursor: pointer; padding: 4px; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(11, 19, 43, 0.96); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 9999; }
    .modal-card { background: var(--card); border: 1px solid var(--border); width: 100%; max-width: 380px; border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; gap: 16px; }
    .auth-tabs { display: flex; background: var(--input); border-radius: 12px; padding: 4px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; font-size: 0.85rem; font-weight: 600; color: var(--muted); border-radius: 8px; cursor: pointer; }
    .auth-tab.active { background: var(--accent); color: #0b132b; }
    .auth-error { color: var(--danger); font-size: 0.82rem; display: none; }
  </style>
</head>
<body>

  <!-- Авторизація -->
  <div class="modal-overlay" id="authModal" style="display: none;">
    <div class="modal-card">
      <h2 id="authTitle" style="font-size: 1.3rem;">Вхід у систему</h2>
      <p style="font-size: 0.85rem; color: var(--muted);">Керуйте власними витратами безпечно</p>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthMode('login')">Вхід</div>
        <div class="auth-tab" id="tabRegister" onclick="switchAuthMode('register')">Реєстрація</div>
      </div>

      <div class="input-group">
        <input type="email" id="authEmail" class="input-text" placeholder="Електронна пошта" autocomplete="email" />
        <input type="password" id="authPassword" class="input-text" placeholder="Пароль" />
      </div>

      <div class="auth-error" id="authError"></div>
      <button class="btn-submit" id="authBtn" onclick="handleAuth()">Увійти</button>
    </div>
  </div>

  <!-- Головний екран -->
  <div class="container" id="appContent">
    <header>
      <div class="brand">
        <h1>Smart Expense</h1>
        <div class="user-tag" id="userBadge">princessvanetta8@gmail.com</div>
      </div>
      <button class="btn-logout" onclick="logout()">Вийти</button>
    </header>

    <div class="card balance-card">
      <div class="balance-title">Загальні витрати</div>
      <div class="balance-val" id="totalSpent">0.00 ₴</div>
      <div class="forecast-box">
        <span style="color: var(--muted);">Прогноз на місяць:</span>
        <strong id="forecastVal">0.00 ₴</strong>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Швидке додавання витрати</div>
      <div class="input-group">
        <input type="text" id="rawInput" class="input-text" placeholder="Наприклад: Сільпо 350 або Кава 60" />
        
        <div class="chip-container">
          <div class="chip active" data-cat="" onclick="selectChip(this)">Авто (ML)</div>
          <div class="chip" data-cat="їжа" onclick="selectChip(this)">Їжа</div>
          <div class="chip" data-cat="транспорт" onclick="selectChip(this)">Транспорт</div>
          <div class="chip" data-cat="комунальні" onclick="selectChip(this)">Комунальні</div>
          <div class="chip" data-cat="покупки" onclick="selectChip(this)">Покупки</div>
          <div class="chip" data-cat="розваги" onclick="selectChip(this)">Розваги</div>
        </div>

        <button class="btn-submit" id="saveBtn" onclick="addExpense()">Зберегти витрату</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Розподіл за категоріями</div>
      <div class="chart-container">
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Останні транзакції</div>
      <div class="tx-list" id="txList"></div>
    </div>
  </div>

  <script>
    let currentAuthMode = 'login';
    let selectedCategory = '';
    let expenseChart = null;

    function getAuthToken() {
      return localStorage.getItem('token');
    }

    function checkAuth() {
      const token = getAuthToken();
      const email = localStorage.getItem('user_email');
      const modal = document.getElementById('authModal');
      
      if (!token) {
        modal.style.display = 'flex';
      } else {
        modal.style.display = 'none';
        document.getElementById('userBadge').innerText = email || 'Мій акаунт';
        loadDashboard();
      }
    }

    function switchAuthMode(mode) {
      currentAuthMode = mode;
      document.getElementById('authError').style.display = 'none';
      if (mode === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('authTitle').innerText = 'Вхід у систему';
        document.getElementById('authBtn').innerText = 'Увійти';
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('authTitle').innerText = 'Реєстрація';
        document.getElementById('authBtn').innerText = 'Зареєструватися';
      }
    }

    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errorDiv = document.getElementById('authError');

      if (!email || !password) {
        errorDiv.innerText = 'Заповніть усі поля';
        errorDiv.style.display = 'block';
        return;
      }

      const endpoint = currentAuthMode === 'login' ? '/api/auth/login' : '/api/auth/register';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Помилка авторизації');

        localStorage.setItem('token', data.token);
        localStorage.setItem('user_email', data.email);
        errorDiv.style.display = 'none';
        checkAuth();
      } catch (err) {
        errorDiv.innerText = err.message;
        errorDiv.style.display = 'block';
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user_email');
      checkAuth();
    }

    function selectChip(el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedCategory = el.getAttribute('data-cat');
    }

    async function authFetch(url, options = {}) {
      const token = getAuthToken();
      if (!options.headers) options.headers = {};
      if (token) options.headers['Authorization'] = `Bearer ${token}`;
      
      const response = await fetch(url, options);
      if (response.status === 401) {
        logout();
        throw new Error('Сесія завершилась');
      }
      return response;
    }

    async function loadDashboard() {
      try {
        const res = await authFetch('/api/dashboard');
        const data = await res.json();

        document.getElementById('totalSpent').innerText = `${Number(data.total_spent || 0).toFixed(2)} ₴`;
        document.getElementById('forecastVal').innerText = `${Number(data.forecast_next_month || 0).toFixed(2)} ₴`;

        renderChart(data.breakdown || {});
        renderTransactions(data.recent_transactions || []);
      } catch (err) {
        console.error(err);
      }
    }

    function renderChart(breakdown) {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      const labels = Object.keys(breakdown);
      const values = labels.map(k => breakdown[k].sum);
      const totalSum = values.reduce((a, b) => a + b, 0);

      const colors = ['#48cae4', '#0077b6', '#52b788', '#f77f00', '#d62828'];

      if (expenseChart) expenseChart.destroy();

      expenseChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: totalSum > 0 ? labels.map(l => l.toUpperCase()) : ['Поки немає даних'],
          datasets: [{
            data: totalSum > 0 ? values : [1],
            backgroundColor: totalSum > 0 ? colors : ['#243056'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#94a3b8', font: { family: 'Montserrat', size: 11 }, padding: 12 }
            }
          },
          cutout: '70%'
        }
      });
    }

    function renderTransactions(list) {
      const listEl = document.getElementById('txList');
      listEl.innerHTML = '';

      if (!list || list.length === 0) {
        listEl.innerHTML = '<div style="color:#64748b;font-size:0.85rem;text-align:center;padding:12px;">Немає записів</div>';
        return;
      }

      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'tx-item';
        div.innerHTML = `
          <div>
            <div class="tx-desc">${item.description}</div>
            <div class="tx-sub">
              <span>${item.date}</span>
              <span class="tx-cat-badge">${item.category}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap: 10px;">
            <span class="tx-amount">-${item.amount} ₴</span>
            <button class="btn-delete" onclick="deleteExpense(${item.id})">✕</button>
          </div>
        `;
        listEl.appendChild(div);
      });
    }

    async function addExpense() {
      const input = document.getElementById('rawInput');
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('saveBtn');
      btn.innerText = 'Збереження...';

      try {
        const res = await authFetch('/api/expenses/smart-add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            raw_text: text,
            manual_category: selectedCategory || null
          })
        });

        if (res.ok) {
          input.value = '';
          await loadDashboard();
        } else {
          const err = await res.json();
          alert(err.detail || 'Помилка збереження');
        }
      } catch (err) {
        alert(err.message || 'Помилка мережі');
      } finally {
        btn.innerText = 'Зберегти витрату';
      }
    }

    async function deleteExpense(id) {
      try {
        const res = await authFetch(`/api/expenses/${id}`, { method: 'DELETE' });
        if (res.ok) loadDashboard();
      } catch (err) {
        console.error(err);
      }
    }

    window.onload = checkAuth;
  </script>
</body>
</html>
